openapi: 3.0.3
info:
  title: Project-3 API
  version: 1.0.0
  description: Production REST API v1 for Project-3 (Laravel + Sanctum + MySQL).
servers:
  - url: /api/v1
    description: Current Server
  - url: https://followapi.ama8.uk/api/v1
    description: Production API
  - url: http://localhost:8000/api/v1
    description: Local Development
security:
  - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: SanctumToken
  parameters:
    AcceptLanguage:
      in: header
      name: Accept-Language
      schema:
        type: string
        enum: [ar, en]
        default: ar
    IdParam:
      in: path
      name: id
      required: true
      schema:
        type: integer
  schemas:
    ErrorResponse:
      type: object
      required: [success, message, code]
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string
        code:
          type: string
          enum: [VALIDATION, UNAUTHENTICATED, FORBIDDEN, FEATURE_OFF, NOT_FOUND, BAD_STATE, READ_ONLY, RATE_LIMITED]
        errors:
          type: object
          additionalProperties:
            type: string
    User:
      type: object
      required: [id, name, email, role, title, active]
      properties:
        id: { type: integer }
        name: { type: string }
        name_en: { type: string, nullable: true }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        role: { type: string, enum: [ceo, pm, monitor, lead, employee, admin] }
        custom_role: { type: string, nullable: true }
        title: { type: string }
        team_id: { type: integer, nullable: true }
        active: { type: boolean }
        avatar_url: { type: string, format: uri, nullable: true }
        birth_date: { type: string, format: date, nullable: true }
        birthday: { type: string, example: "03-07", nullable: true }
    Team:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        name_en: { type: string }
        lead_id: { type: integer }
    TaskStatus:
      type: object
      required: [key, name, name_en, tone]
      properties:
        key: { type: string }
        name: { type: string }
        name_en: { type: string }
        tone: { type: string, enum: [new, todo, progress, review, testing, done, blocked] }
    Project:
      type: object
      required: [id, code, name, description, pm_id, member_ids, start, end, state, priority, uses_sprints, statuses, phases]
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        name_en: { type: string }
        description: { type: string }
        pm_id: { type: integer }
        member_ids: { type: array, items: { type: integer } }
        start: { type: string, format: date }
        end: { type: string, format: date }
        state: { type: string, enum: [planned, active, paused, done] }
        priority: { type: string, enum: [high, medium, low] }
        uses_sprints: { type: boolean }
        statuses: { type: array, items: { $ref: '#/components/schemas/TaskStatus' } }
        phases:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
    Task:
      type: object
      required: [id, code, project_id, title, description, priority, status, subtasks_done, subtasks_total, updated_at]
      properties:
        id: { type: integer }
        code: { type: string }
        project_id: { type: integer }
        phase_id: { type: integer }
        sprint_id: { type: integer }
        title: { type: string }
        description: { type: string }
        depends_on: { type: array, items: { type: integer } }
        assignee_id: { type: integer }
        start: { type: string, format: date }
        due: { type: string, format: date }
        priority: { type: string, enum: [high, medium, low] }
        status: { type: string }
        blocked_reason: { type: string }
        approval: { type: object }
        subtasks_done: { type: integer }
        subtasks_total: { type: integer }
        created_by: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Attachment:
      type: object
      required: [id, owner_type, owner_id, name, size, mime, url, uploaded_by, at]
      properties:
        id: { type: integer }
        owner_type: { type: string, enum: [task, project, bug, message] }
        owner_id: { type: integer }
        name: { type: string }
        size: { type: integer }
        mime: { type: string }
        voice:
          type: object
          nullable: true
          properties:
            duration_s: { type: number }
            peaks: { type: array, items: { type: integer } }
        url: { type: string, format: uri }
        uploaded_by: { type: integer }
        at: { type: string, format: date-time }
    Rating:
      type: object
      required: [id, subject_type, subject_id, rater_id, score, reason_type, reason, private, created_at]
      properties:
        id: { type: integer }
        subject_type: { type: string, enum: [team, person] }
        subject_id: { type: integer }
        rater_id: { type: integer }
        score: { type: integer, minimum: 1, maximum: 5 }
        reason_type: { type: string, enum: [quality, deadlines, teamwork, attitude, incident, other] }
        reason: { type: string }
        project_id: { type: integer, nullable: true }
        project_name: { type: string, nullable: true }
        project_name_en: { type: string, nullable: true }
        period:
          type: object
          nullable: true
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        private: { type: boolean }
        created_at: { type: string, format: date-time }
        edited_at: { type: string, format: date-time, nullable: true }
        edited_by: { type: integer, nullable: true }
    AdminSession:
      type: object
      required: [id, user_id, started_at, last_seen_at]
      properties:
        id: { type: string }
        user_id: { type: integer }
        ip: { type: string, nullable: true }
        user_agent: { type: string, nullable: true }
        started_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        current: { type: boolean }
    PushSubscriptionInput:
      type: object
      required: [endpoint, keys, device]
      properties:
        endpoint: { type: string, format: uri }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string }
            auth: { type: string }
        device: { type: string }
paths:
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Sign in with email or phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string }
                password: { type: string }
      responses:
        '200': { description: 'Authenticated session { token, user }' }
        '403': { description: Account stopped }
        '422': { description: Invalid credentials }
        '429': { description: Account locked or rate limited }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current Bearer token
      responses:
        '200': { description: Null }
        '401': { description: Unauthenticated }
  /me:
    get:
      tags: [Auth]
      summary: Current authenticated user
      responses:
        '200': { description: User }
  /me/password:
    put:
      tags: [Auth]
      summary: Change current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password]
              properties:
                current_password: { type: string }
                password: { type: string }
      responses:
        '200': { description: 'Null' }
        '422': { description: Validation error }
  /me/avatar:
    put:
      tags: [Profile]
      summary: Set or replace own profile picture (PNG, JPEG or WebP, max 200 KB)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: User }
        '422': { description: Invalid file }
    delete:
      tags: [Profile]
      summary: Remove own profile picture
      responses:
        '200': { description: User }
  /users/{id}/avatar:
    delete:
      tags: [Profile]
      summary: Remove a user profile picture (admin or CEO)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200': { description: User }
        '403': { description: Forbidden }
        '404': { description: User not found }
  /users:
    get:
      tags: [Auth]
      summary: List all users
      responses:
        '200': { description: 'User[]' }
  /teams:
    get:
      tags: [Admin]
      summary: List teams
      responses:
        '200': { description: 'Team[]' }
  /projects:
    get:
      tags: [Projects]
      summary: List visible projects with task counts
      responses:
        '200': { description: 'ProjectSummary[]' }
    post:
      tags: [Projects]
      summary: Create project (CEO, PM or Monitor)
      responses:
        '201': { description: Project }
  /projects/{id}:
    get:
      tags: [Projects]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Project }, '404': { description: Not found } }
    patch:
      tags: [Projects]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Project } }
  /projects/{id}/statuses:
    put:
      tags: [Projects]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Project } }
  /projects/{id}/phases:
    put:
      tags: [Projects]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Project } }
  /projects/{id}/history:
    get:
      tags: [Projects]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: 'ProjectEvent[]' } }
  /projects/{id}/sprints:
    get:
      tags: [Sprints]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: 'Sprint[]' } }
    post:
      tags: [Sprints]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '201': { description: Sprint } }
  /sprints/{id}:
    patch:
      tags: [Sprints]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Sprint } }
    delete:
      tags: [Sprints]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Null } }
  /sprints/{id}/close:
    post:
      tags: [Sprints]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Sprint } }
  /templates:
    get:
      tags: [Templates]
      responses: { '200': { description: 'ProjectTemplate[]' } }
  /projects/{id}/template:
    post:
      tags: [Templates]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '201': { description: ProjectTemplate } }
  /templates/{id}:
    delete:
      tags: [Templates]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Null } }
  /projects/{id}/tasks:
    get:
      tags: [Tasks]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: 'Task[]' } }
    post:
      tags: [Tasks]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '201': { description: Task } }
  /me/tasks:
    get:
      tags: [Tasks]
      responses: { '200': { description: 'Task[]' } }
  /tasks/{id}:
    get:
      tags: [Tasks]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Task } }
    patch:
      tags: [Tasks]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Task } }
  /tasks/{id}/status:
    post:
      tags: [Tasks]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: '{ task, outcome }' } }
  /tasks/{id}/approval:
    post:
      tags: [Tasks]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Task } }
  /tasks/{id}/dependencies:
    put:
      tags: [Tasks]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Task } }
  /tasks/{id}/comments:
    get:
      tags: [Tasks]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: 'TaskComment[]' } }
    post:
      tags: [Tasks]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '201': { description: TaskComment } }
  /tasks/{id}/history:
    get:
      tags: [Tasks]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: 'TaskEvent[]' } }
  /notifications:
    get:
      tags: [Notifications]
      responses: { '200': { description: 'Notification[] (max 100)' } }
  /notifications/{id}/read:
    post:
      tags: [Notifications]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Null } }
  /notifications/read-all:
    post:
      tags: [Notifications]
      responses: { '200': { description: Null } }
  /notifications/preferences:
    get:
      tags: [Notifications]
      responses: { '200': { description: NotificationPrefs } }
    put:
      tags: [Notifications]
      responses: { '200': { description: NotificationPrefs } }
  /tasks/{id}/attachments:
    get:
      tags: [Attachments]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: 'Attachment[]' } }
    post:
      tags: [Attachments]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '201': { description: Attachment } }
  /projects/{id}/attachments:
    get:
      tags: [Attachments]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: 'Attachment[]' } }
    post:
      tags: [Attachments]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '201': { description: Attachment } }
  /bugs/{id}/attachments:
    get:
      tags: [Attachments]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: 'Attachment[]' } }
    post:
      tags: [Attachments]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '201': { description: Attachment } }
  /messages/{id}/attachments:
    get:
      tags: [Attachments]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: 'Attachment[]' } }
    post:
      tags: [Attachments]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '201': { description: Attachment } }
  /attachments/{id}:
    delete:
      tags: [Attachments]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Null } }
  /attachments/{id}/download:
    get:
      tags: [Attachments]
      security: []
      summary: Signed private download URL (Content-Disposition attachment)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Binary file stream } }
  /announcements:
    get: { tags: [Announcements], responses: { '200': { description: 'Announcement[]' } } }
    post: { tags: [Announcements], responses: { '201': { description: Announcement } } }
  /announcements/{id}:
    get:
      tags: [Announcements]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Announcement } }
    delete:
      tags: [Announcements]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Null } }
  /announcements/{id}/seen:
    post:
      tags: [Announcements]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Null } }
  /announcements/{id}/reads:
    get:
      tags: [Announcements]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: AnnouncementReads } }
  /bugs:
    get: { tags: [Bugs], responses: { '200': { description: 'Bug[]' } } }
  /projects/{id}/bugs:
    post:
      tags: [Bugs]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '201': { description: Bug } }
  /bugs/{id}:
    get:
      tags: [Bugs]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Bug } }
    patch:
      tags: [Bugs]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Bug } }
  /bugs/{id}/status:
    post:
      tags: [Bugs]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Bug } }
  /bugs/{id}/history:
    get:
      tags: [Bugs]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: 'BugEvent[]' } }
  /chats:
    get: { tags: [Chat], responses: { '200': { description: 'Conversation[]' } } }
  /chats/direct:
    post: { tags: [Chat], responses: { '200': { description: Conversation }, '403': { description: 'Only the CEO may start a direct chat with the CEO' } } }
  /chats/groups:
    post:
      tags: [Chat]
      summary: Create group chat (monitor, pm, lead or ceo)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, member_ids]
              properties:
                name: { type: string, maxLength: 60 }
                member_ids: { type: array, items: { type: integer } }
      responses:
        '201': { description: Conversation }
  /chats/{key}:
    patch:
      tags: [Chat]
      summary: Rename group or replace members (group manager or CEO member)
      parameters: [{ in: path, name: key, required: true, schema: { type: string } }]
      responses:
        '200': { description: Conversation }
  /chats/{key}/leave:
    post:
      tags: [Chat]
      summary: Leave group chat
      parameters: [{ in: path, name: key, required: true, schema: { type: string } }]
      responses:
        '200': { description: 'Null' }
  /chats/{key}/messages:
    get:
      tags: [Chat]
      parameters:
        - { in: path, name: key, required: true, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { in: query, name: before, schema: { type: integer } }
      responses:
        '200': { description: 'Message[] (oldest first inside page)' }
        '304': { description: 'Not Modified (matching ETag)' }
    post:
      tags: [Chat]
      parameters: [{ in: path, name: key, required: true, schema: { type: string } }]
      responses: { '201': { description: Message } }
  /chats/{key}/read:
    post:
      tags: [Chat]
      parameters: [{ in: path, name: key, required: true, schema: { type: string } }]
      responses: { '200': { description: Null } }
  /reports/overview:
    get: { tags: [Reports], responses: { '200': { description: Overview } } }
  /performance:
    get: { tags: [Performance], responses: { '200': { description: '{ people, teams }' } } }
  /performance/people/{id}:
    get:
      tags: [Performance]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: PersonDetail } }
  /performance/criteria:
    get: { tags: [Performance], responses: { '200': { description: Criteria } } }
    put: { tags: [Performance], responses: { '200': { description: Criteria } } }
  /performance/criteria/approve:
    post: { tags: [Performance], responses: { '200': { description: Criteria } } }
  /reviews:
    post: { tags: [Performance], responses: { '201': { description: Review } } }
  /reviews/{id}:
    patch:
      tags: [Performance]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Review } }
  /reviews/{id}/finalize:
    post:
      tags: [Performance]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Review } }
  /admin/users:
    get: { tags: [Admin], summary: List users (admin, ceo, monitor), responses: { '200': { description: 'AdminUser[]' } } }
    post: { tags: [Admin], summary: Create user (admin, ceo, monitor; monitor cannot assign ceo/admin), responses: { '201': { description: User } } }
  /admin/users/import:
    post: { tags: [Admin], responses: { '200': { description: ImportResult } } }
  /admin/users/{id}:
    patch:
      tags: [Admin]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: User } }
  /admin/users/{id}/unlock:
    post:
      tags: [Admin]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: AdminUser }, '409': { description: Not locked } }
  /admin/users/{id}/sessions:
    delete:
      tags: [Admin]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Sessions ended count } }
  /admin/sessions:
    get: { tags: [Admin], responses: { '200': { description: 'AdminSession[]' } } }
  /admin/sessions/{id}:
    delete:
      tags: [Admin]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses: { '200': { description: Ended }, '409': { description: Cannot end current session } }
  /admin/security/summary:
    get: { tags: [Admin], responses: { '200': { description: SecuritySummary } } }
  /me/push-subscriptions:
    post:
      tags: [Push]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushSubscriptionInput' }
      responses: { '200': { description: Subscribed } }
    delete:
      tags: [Push]
      responses: { '200': { description: Unsubscribed } }
  /teams/ratings/summary:
    get: { tags: [Ratings], responses: { '200': { description: 'TeamListRow[]' } } }
  /teams/{id}:
    get:
      tags: [Ratings]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: TeamDetail } }
  /teams/{id}/ratings:
    get:
      tags: [Ratings]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: RatingList } }
    post:
      tags: [Ratings]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '201': { description: Rating } }
  /people/ratings/summary:
    get: { tags: [Ratings], responses: { '200': { description: 'PersonRatingRow[]' } } }
  /people/{id}/ratings:
    get:
      tags: [Ratings]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: RatingList } }
    post:
      tags: [Ratings]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '201': { description: Rating } }
  /ratings/{id}:
    patch:
      tags: [Ratings]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Rating }, '409': { description: Edit window expired } }
    delete:
      tags: [Ratings]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { description: Deleted }, '409': { description: Delete window expired } }
  /admin/teams:
    post: { tags: [Admin], responses: { '201': { description: Team } } }
  /admin/teams/{id}:
    patch:
      tags: [Admin]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
